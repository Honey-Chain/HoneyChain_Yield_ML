services:
  - type: web
    name: honeychain-yield-ml
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: starter
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: PORT
        value: 5002
      - key: CORS_ORIGINS
        value: "*"
