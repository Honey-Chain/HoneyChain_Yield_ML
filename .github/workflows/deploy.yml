name: Deploy Yield & Harvest ML Microservice to AIC VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Yield ML Service via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 162.19.81.122
          port: 20130
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/services/honeychain-yield-ml
            git fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main
            /opt/services/honeychain-yield-ml/deploy.sh
